name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: netpulse-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NetPulse-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: netpulse-windows
          path: NetPulse-windows.zip

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          gh release create "$TAG" \
            "artifacts/netpulse-android/app-release.apk#NetPulse-android.apk" \
            "artifacts/netpulse-windows/NetPulse-windows.zip#NetPulse-windows.zip" \
            --title "NetPulse $TAG" \
            --generate-notes \
            --notes "iOS não está incluído neste release: build assinado requer conta Apple Developer e não pode ser gerado por este workflow."
